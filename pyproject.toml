[project]
name = "cadloop"
version = "0.3.0"
description = "Parametric CAD and slicing behind MCP, with every plate proven on the bed"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Richard Fortune", email = "richard.fortune@gmail.com" }]
keywords = ["mcp", "openscad", "slicer", "orcaslicer", "3d-printing", "cad",
            "gcode", "parametric", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]
# <2: mcp 2.0.0 (2026-07-28) removed mcp.server.fastmcp and restructured
# the server API; >=1.2 is where FastMCP landed in the 1.x line.
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
# For the worked example's own checker, models/verify_spirograph.py, which is
# not part of the package. cadloop itself needs nothing beyond mcp.
verify = ["shapely>=2.0"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/richardofortune/cadloop"
Repository = "https://github.com/richardofortune/cadloop"
Issues = "https://github.com/richardofortune/cadloop/issues"

[project.scripts]
cadloop-openscad = "cadloop.openscad_server:main"
cadloop-slicer = "cadloop.slicer_server:main"
# Removed in 0.3.0, kept as a signpost so 0.2.0 callers get a reason rather
# than "command not found". Delete this line and _verify_moved.py in 0.4.0.
cadloop-verify = "cadloop._verify_moved:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadloop"]

[tool.hatch.build.targets.sdist]
# Ship the source, the worked example and the tests. Leave local editor and
# agent state out, and the filmed walkthrough too: it is a couple of megabytes
# of media that the README already links to on GitHub.
exclude = [".claude", ".vscode", ".github", "out", ".venv", "/docs/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# smoke.py is a standalone script driving real MCP sessions, not a pytest module
addopts = "--ignore=tests/smoke.py --ignore=tests/mock"
