name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # openscad so the OpenSCAD half of the smoke test actually runs rather
      # than skipping; xvfb-run because PNG export needs a GL context.
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad xvfb

      # apt ships 2021.01, which predates the Manifold backend and evaluates
      # the spirograph sheet with CGAL. The layout check times out against it
      # and reports nothing, so it gets a current build of its own.
      - name: Install a Manifold-capable OpenSCAD for the layout check
        run: sudo snap install openscad-nightly

      - name: Install
        run: pip install -e ".[verify,dev]"

      - name: Unit tests
        run: pytest -q

      - name: Rolling interference and layout checks
        env:
          OPENSCAD_BIN: /snap/bin/openscad-nightly
        run: cadloop-verify

      - name: Smoke test, both servers over MCP stdio
        run: python tests/smoke.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Check package metadata renders on PyPI
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
