name: release

# Publishes to PyPI via trusted publishing (OIDC), so there is no API token to
# store. Requires a one-time setup on PyPI: add a trusted publisher for the
# project pointing at this repo, workflow `release.yml`, environment `pypi`.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build twine

      - run: python -m build

      - name: Check package metadata renders on PyPI
        run: twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
